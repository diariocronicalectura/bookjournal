<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Journal Digital</title>

    <!-- Google Fonts & Iconos -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0" />

    <!-- Estilos CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- PÁGINA 1: PORTADA -->
    <div class="journal-page cover-page">
        <img class="cover-img" src="portada.jpeg" alt="Book Journal Portada">
    </div>

    <!-- PÁGINA 2: LECTURAS DEL AÑO -->
    <div class="journal-page">
        <div class="page-header">
            <h1 class="page-title">Lecturas del Año</h1>
            <p class="page-subtitle">Mi Resumen Mensual</p>
            <div class="header-divider">
                <div class="line"></div>
                <i class="fa-solid fa-seedling flower"></i>
                <div class="line"></div>
            </div>
        </div>

        <!-- Grid de Meses (se genera dinámicamente) -->
        <div class="months-grid" id="monthsGrid"></div>

        <div class="year-summary-box">
            <div class="summary-item">
                <div class="label">Total Libros</div>
                <input type="number" id="total_libros" class="save-field" placeholder="0">
            </div>
            <div style="width: 1px; height: 16px; background: var(--accent-pink);"></div>
            <div class="summary-item">
                <div class="label">Total Páginas</div>
                <input type="number" id="total_paginas" class="save-field" placeholder="0">
            </div>
        </div>
    </div>

    <!-- PÁGINA 3: MI LISTA DE LIBROS -->
    <div class="journal-page">
        <div class="page-header">
            <h1 class="page-title">Mi Lista de Libros</h1>
            <p class="page-subtitle">Pendientes & Leídos</p>
            <div class="header-divider">
                <div class="line"></div>
                <i class="fa-solid fa-book-bookmark flower"></i>
                <div class="line"></div>
            </div>
        </div>

        <div class="book-list-container" id="bookListContainer">
            <div class="book-list-header">
                <span></span>
                <span>Título del Libro</span>
                <span>Autor</span>
                <span></span>
            </div>
            <!-- Filas dinámicas -->
        </div>

        <div class="add-row-control">
            <button class="btn-add-inline" onclick="addNewBookRow()">
                <i class="fa-solid fa-plus"></i> Añadir más libros
            </button>
        </div>
    </div>

    <!-- CONTENEDOR DE FICHAS DE LECTURA (DINÁMICAS) -->
    <div id="fichasContainer" style="display: flex; flex-direction: column; gap: 30px; width: 100%; align-items: center;"></div>

    <!-- Script JS -->
    <script src="script.js"></script>
</body>
</html>
