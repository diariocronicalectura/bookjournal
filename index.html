<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Journal — Iniciar sesión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400&family=Alex+Brush&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --primary-rose:#b56576;
    --dark-rose:#6d3543;
    --accent-pink:#eaacb8;
    --text-main:#4a383d;
    --text-light:#8c7077;
    --border-color:#ebd0d6;
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; padding:0; min-height:100vh; }
  body{
    font-family:'Montserrat', sans-serif;
    color:var(--text-main);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background-image:
      linear-gradient(180deg, rgba(74,44,52,0.15), rgba(74,44,52,0.55)),
      url('portada.JPG');
    background-size:cover;
    background-position:center;
  }
  .login-card{
    width:100%; max-width:400px;
    background:rgba(255,255,255,0.92);
    backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,0.6);
    border-radius:18px;
    padding:38px 32px 30px;
    box-shadow:0 20px 50px rgba(74,44,52,0.35);
    text-align:center;
  }
  .brand{
    font-family:'Alex Brush', cursive;
    font-weight:400;
    font-size:44px;
    color:var(--primary-rose);
    margin:0;
    line-height:1;
  }
  .tagline{
    font-style:italic;
    color:var(--text-light);
    font-size:13px;
    margin:4px 0 26px;
  }
  #authTitle{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size:21px;
    margin:0 0 4px;
    text-align:left;
    color:var(--dark-rose);
  }
  .sub{ font-style:italic; color:var(--text-light); margin:0 0 22px; font-size:14px; text-align:left; }
  label{
    display:block; font-size:11px; letter-spacing:.5px; text-transform:uppercase;
    color:var(--text-light); margin:16px 0 6px; text-align:left;
  }
  input{
    width:100%; background:#fff; border:1px solid var(--border-color); border-radius:8px;
    padding:10px 12px; font-family:'Montserrat', sans-serif; font-size:15px; color:var(--text-main);
  }
  input:focus{ outline:none; border-color:var(--primary-rose); }
  .actions{ margin-top:22px; display:flex; flex-direction:column; gap:10px; }
  button{ font-size:13px; letter-spacing:.5px; cursor:pointer; border-radius:8px; transition:transform .15s ease, opacity .15s ease; }
  button:active{ transform:translateY(1px); }
  .btn-primary{ background:linear-gradient(135deg, var(--primary-rose), var(--dark-rose)); color:#fff; border:none; padding:12px 22px; font-weight:600; }
  .btn-primary:hover{ opacity:.9; }
  .btn-ghost{ background:transparent; border:none; color:var(--text-light); text-decoration:underline; padding:4px; font-size:12px; }
  .error{ color:#c0392b; font-size:13px; margin-top:12px; min-height:16px; text-align:left; }
</style>
</head>
<body>
  <div class="login-card">
    <p class="brand">Book Journal</p>
    <p class="tagline">"Solo un capítulo más..."</p>
    <h1 id="authTitle">Ficha del lector</h1>
    <p class="sub" id="authSub">Ingresa para continuar tu diario de lectura</p>

    <label>Correo electrónico</label>
    <input type="email" id="email" placeholder="tú@correo.com">

    <label>Contraseña</label>
    <input type="password" id="password" placeholder="••••••••">

    <div class="actions">
      <button class="btn-primary" id="submitBtn">Entrar</button>
      <button class="btn-ghost" id="toggleMode">¿No tienes cuenta? Crea una</button>
    </div>
    <div class="error" id="authError"></div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-auth-compat.min.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBiM3YiN1kObjDMQszhmgrWkqlvwFgreCY",
  authDomain: "bookjournal-a201e.firebaseapp.com",
  projectId: "bookjournal-a201e",
  storageBucket: "bookjournal-a201e.firebasestorage.app",
  messagingSenderId: "336171207420",
  appId: "1:336171207420:web:59a58a5fe19eda09bb6579"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

let mode = 'login';
const authTitle = document.getElementById('authTitle');
const authSub = document.getElementById('authSub');
const toggleBtn = document.getElementById('toggleMode');
const submitBtn = document.getElementById('submitBtn');
const authError = document.getElementById('authError');

toggleBtn.addEventListener('click', () => {
  mode = mode === 'login' ? 'register' : 'login';
  const isLogin = mode === 'login';
  authTitle.textContent = isLogin ? 'Ficha del lector' : 'Nueva ficha de lector';
  authSub.textContent = isLogin ? 'Ingresa para continuar tu diario de lectura' : 'Crea tu cuenta para empezar tu diario';
  submitBtn.textContent = isLogin ? 'Entrar' : 'Registrarme';
  toggleBtn.textContent = isLogin ? '¿No tienes cuenta? Crea una' : '¿Ya tienes cuenta? Inicia sesión';
  authError.textContent = '';
});

submitBtn.addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  authError.textContent = '';
  if(!email || !password){ authError.textContent = 'Completa correo y contraseña.'; return; }
  try{
    if(mode === 'login'){
      await auth.signInWithEmailAndPassword(email, password);
    } else {
      await auth.createUserWithEmailAndPassword(email, password);
    }
    window.location.href = 'diario.html';
  } catch(e){
    authError.textContent = traducirError(e.code);
  }
});

function traducirError(code){
  const map = {
    'auth/invalid-email':'Correo no válido.',
    'auth/user-not-found':'No existe una cuenta con ese correo.',
    'auth/wrong-password':'Contraseña incorrecta.',
    'auth/email-already-in-use':'Ya existe una cuenta con ese correo.',
    'auth/weak-password':'La contraseña debe tener al menos 6 caracteres.',
    'auth/unauthorized-domain':'Este dominio no está autorizado en Firebase.',
  };
  return map[code] || 'Ocurrió un error. Intenta de nuevo.';
}

auth.onAuthStateChanged(user => {
  if(user){ window.location.href = 'diario.html'; }
});
</script>
</body>
</html>
