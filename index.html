<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crónica de Lectura — Diario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Dancing+Script:wght@600;700&family=Literata:ital,wght@0,400;0,500;0,600;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBEEF2;
    --paper-card:#FEF9FA;
    --ink:#4A2C34;
    --ink-soft:#9C7684;
    --burgundy:#B15C74;
    --sage:#C9A227;
    --gold:#C9A227;
    --line: rgba(177,92,116,0.22);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 15%, rgba(232,180,200,0.35), transparent 40%),
      radial-gradient(circle at 85% 75%, rgba(201,162,39,0.08), transparent 45%),
      var(--paper);
    font-family:'Literata', serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }
  .app{width:100%; max-width:640px;}

  /* ---------- LOGIN CARD (ficha de biblioteca) ---------- */
  .card{
    position:relative;
    background:var(--paper-card);
    border:1.5px solid var(--ink);
    border-radius:2px;
    padding:40px 36px 32px;
    box-shadow: 6px 6px 0 rgba(42,35,28,0.08);
  }
  .card::before{
    content:"";
    position:absolute; inset:8px;
    border:1px dashed var(--line);
    pointer-events:none;
  }
  .eyebrow{
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--ink-soft);
    display:flex;
    justify-content:space-between;
  }
  h1{
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-size:clamp(28px,5vw,38px);
    margin:10px 0 4px;
  }
  #authTitle{
    font-family:'Dancing Script', cursive;
    font-weight:700;
    font-size:clamp(34px,6vw,46px);
    color:var(--burgundy);
  }
  .sub{
    font-style:italic;
    color:var(--ink-soft);
    margin:0 0 28px;
    font-size:15px;
  }
  .stamp{
    position:absolute; top:26px; right:28px;
    border:2px solid var(--burgundy);
    color:var(--burgundy);
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:1px;
    padding:5px 10px;
    transform:rotate(6deg);
    opacity:0.85;
    border-radius:3px;
  }
  label{
    display:block;
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:18px 0 6px;
  }
  input{
    width:100%;
    background:transparent;
    border:none;
    border-bottom:1.5px dotted var(--ink);
    padding:8px 2px;
    font-family:'Literata', serif;
    font-size:16px;
    color:var(--ink);
  }
  input:focus{ outline:none; border-bottom:1.5px solid var(--burgundy); }
  .row{ display:flex; gap:16px; }
  .row > div{ flex:1; }
  .actions{ margin-top:30px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  button{
    font-family:'Space Mono', monospace;
    font-size:13px;
    letter-spacing:1px;
    text-transform:uppercase;
    cursor:pointer;
    border-radius:2px;
    transition:transform .15s ease;
  }
  button:active{ transform:translateY(1px); }
  .btn-primary{
    background:var(--ink);
    color:var(--paper-card);
    border:1.5px solid var(--ink);
    padding:12px 22px;
  }
  .btn-primary:hover{ background:var(--burgundy); border-color:var(--burgundy); }
  .btn-ghost{
    background:transparent;
    border:none;
    color:var(--ink-soft);
    text-decoration:underline;
    padding:4px;
  }
  .error{
    color:var(--burgundy);
    font-size:13px;
    margin-top:14px;
    min-height:18px;
  }

  /* ---------- DASHBOARD ---------- */
  .hidden{ display:none !important; }
  .topbar{
    display:flex; justify-content:space-between; align-items:baseline;
    border-bottom:1.5px solid var(--ink);
    padding-bottom:14px; margin-bottom:24px;
  }
  .topbar h1{ margin:0; font-size:28px; }
  .signout{ background:none; border:none; color:var(--ink-soft); text-decoration:underline; font-family:'Space Mono',monospace; font-size:12px; }
  .stats{ display:flex; gap:14px; margin-bottom:28px; }
  .stat{
    flex:1; background:var(--paper-card); border:1px solid var(--line);
    padding:16px; text-align:center; border-radius:2px;
  }
  .stat b{ display:block; font-family:'Playfair Display',serif; font-size:26px; }
  .stat span{ font-family:'Space Mono',monospace; font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--ink-soft); }

  .add-book{
    background:var(--paper-card); border:1px solid var(--line);
    border-radius:2px; padding:18px 20px; margin-bottom:26px;
  }
  .add-book .row{ margin-bottom:10px; }
  .add-book select{
    font-family:'Space Mono',monospace; font-size:12px; padding:8px;
    border:1px solid var(--line); background:transparent; border-radius:2px;
  }

  .book{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 4px; border-bottom:1px dashed var(--line);
  }
  .book-info b{ font-family:'Playfair Display',serif; font-size:17px; font-weight:600; }
  .book-info .meta{ font-size:13px; color:var(--ink-soft); font-style:italic; }
  .tag{
    font-family:'Space Mono',monospace; font-size:10px; letter-spacing:1px;
    text-transform:uppercase; padding:3px 8px; border-radius:10px; cursor:pointer;
  }
  .tag.leido{ background:rgba(177,92,116,0.16); color:var(--burgundy); }
  .tag.pendiente{ background:rgba(201,162,39,0.18); color:#9C7D1F; }
  .book-actions{ display:flex; align-items:center; gap:10px; }
  .del{ background:none; border:none; color:var(--burgundy); font-size:18px; line-height:1; cursor:pointer; }
  .empty{ font-style:italic; color:var(--ink-soft); padding:20px 4px; }
</style>
</head>
<body>
<div class="app">

  <!-- LOGIN / REGISTRO -->
  <div id="authView" class="card">
    <div class="stamp" id="stampLabel">REGISTRO</div>
    <div class="eyebrow"><span>Crónica de Lectura</span><span id="dateStamp"></span></div>
    <h1 id="authTitle">Ficha del lector</h1>
    <p class="sub" id="authSub">Ingresa para continuar tu diario de lectura</p>

    <label>Correo electrónico</label>
    <input type="email" id="email" placeholder="tú@correo.com">

    <label>Contraseña</label>
    <input type="password" id="password" placeholder="••••••••">

    <div class="actions">
      <button class="btn-primary" id="submitBtn">Entrar</button>
      <button class="btn-ghost" id="toggleMode">¿No tienes cuenta? Crea una</button>
    </div>
    <div class="error" id="authError"></div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashView" class="hidden">
    <div class="topbar">
      <h1>Lecturas del año</h1>
      <button class="signout" id="signOutBtn">Cerrar sesión</button>
    </div>

    <div class="stats">
      <div class="stat"><b id="totalLibros">0</b><span>Total libros</span></div>
      <div class="stat"><b id="totalPaginas">0</b><span>Total páginas</span></div>
    </div>

    <div class="add-book">
      <div class="row">
        <div><label>Título del libro</label><input id="newTitle" placeholder="Cien años de soledad"></div>
        <div><label>Autor</label><input id="newAutor" placeholder="Gabriel García Márquez"></div>
      </div>
      <div class="row">
        <div><label>Páginas</label><input id="newPaginas" type="number" min="0" placeholder="350"></div>
        <div>
          <label>Estado</label>
          <select id="newEstado"><option value="pendiente">Pendiente</option><option value="leido">Leído</option></select>
        </div>
      </div>
      <button class="btn-primary" id="addBookBtn" style="margin-top:10px;">Añadir libro</button>
    </div>

    <div id="bookList"></div>
  </div>

</div>

<!-- Firebase SDK (compat) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-firestore-compat.min.js"></script>

<script>
// ============================================
// 1) PEGA AQUÍ TU CONFIG DE FIREBASE
//    (Configuración del proyecto > Tus apps > SDK config)
// ============================================
const firebaseConfig = {
  apiKey: "AIzaSyBiM3YiN1kObjDMQszhmgrWkqlvwFgreCY",
  authDomain: "bookjournal-a201e.firebaseapp.com",
  projectId: "bookjournal-a201e",
  storageBucket: "bookjournal-a201e.firebasestorage.app",
  messagingSenderId: "336171207420",
  appId: "1:336171207420:web:59a58a5fe19eda09bb6579"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ---------- Fecha estilo "sello de biblioteca" ----------
document.getElementById('dateStamp').textContent =
  new Date().toLocaleDateString('es-ES', { day:'2-digit', month:'short', year:'numeric' }).toUpperCase();

// ---------- Toggle Login / Registro ----------
let mode = 'login'; // o 'register'
const authTitle = document.getElementById('authTitle');
const authSub = document.getElementById('authSub');
const toggleBtn = document.getElementById('toggleMode');
const submitBtn = document.getElementById('submitBtn');
const stampLabel = document.getElementById('stampLabel');
const authError = document.getElementById('authError');

toggleBtn.addEventListener('click', () => {
  mode = mode === 'login' ? 'register' : 'login';
  const isLogin = mode === 'login';
  authTitle.textContent = isLogin ? 'Ficha del lector' : 'Nueva ficha de lector';
  authSub.textContent = isLogin ? 'Ingresa para continuar tu diario de lectura' : 'Crea tu cuenta para empezar tu diario';
  submitBtn.textContent = isLogin ? 'Entrar' : 'Registrarme';
  toggleBtn.textContent = isLogin ? '¿No tienes cuenta? Crea una' : '¿Ya tienes cuenta? Inicia sesión';
  stampLabel.textContent = isLogin ? 'REGISTRO' : 'ALTA';
  authError.textContent = '';
});

submitBtn.addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  authError.textContent = '';
  if(!email || !password){ authError.textContent = 'Completa correo y contraseña.'; return; }
  try{
    if(mode === 'login'){
      await auth.signInWithEmailAndPassword(email, password);
    } else {
      await auth.createUserWithEmailAndPassword(email, password);
    }
  } catch(e){
    authError.textContent = traducirError(e.code);
  }
});

function traducirError(code){
  const map = {
    'auth/invalid-email':'Correo no válido.',
    'auth/user-not-found':'No existe una cuenta con ese correo.',
    'auth/wrong-password':'Contraseña incorrecta.',
    'auth/email-already-in-use':'Ya existe una cuenta con ese correo.',
    'auth/weak-password':'La contraseña debe tener al menos 6 caracteres.',
  };
  return map[code] || 'Ocurrió un error. Intenta de nuevo.';
}

document.getElementById('signOutBtn').addEventListener('click', () => auth.signOut());

// ---------- Estado de sesión ----------
const authView = document.getElementById('authView');
const dashView = document.getElementById('dashView');
let unsubscribeBooks = null;

auth.onAuthStateChanged(user => {
  if(user){
    authView.classList.add('hidden');
    dashView.classList.remove('hidden');
    escucharLibros(user.uid);
  } else {
    dashView.classList.add('hidden');
    authView.classList.remove('hidden');
    if(unsubscribeBooks) unsubscribeBooks();
  }
});

// ---------- Libros (Firestore) ----------
function escucharLibros(uid){
  const ref = db.collection('users').doc(uid).collection('books').orderBy('creado','desc');
  unsubscribeBooks = ref.onSnapshot(snapshot => {
    const libros = [];
    snapshot.forEach(doc => libros.push({ id: doc.id, ...doc.data() }));
    renderLibros(libros);
  });
}

document.getElementById('addBookBtn').addEventListener('click', async () => {
  const user = auth.currentUser;
  if(!user) return;
  const titulo = document.getElementById('newTitle').value.trim();
  const autor = document.getElementById('newAutor').value.trim();
  const paginas = parseInt(document.getElementById('newPaginas').value) || 0;
  const estado = document.getElementById('newEstado').value;
  if(!titulo){ return; }

  await db.collection('users').doc(user.uid).collection('books').add({
    titulo, autor, paginas, estado, creado: firebase.firestore.FieldValue.serverTimestamp()
  });

  document.getElementById('newTitle').value = '';
  document.getElementById('newAutor').value = '';
  document.getElementById('newPaginas').value = '';
  document.getElementById('newEstado').value = 'pendiente';
});

function renderLibros(libros){
  const cont = document.getElementById('bookList');
  cont.innerHTML = '';

  const totalLibros = libros.filter(l => l.estado === 'leido').length;
  const totalPaginas = libros.filter(l => l.estado === 'leido').reduce((a,l) => a + (l.paginas||0), 0);
  document.getElementById('totalLibros').textContent = totalLibros;
  document.getElementById('totalPaginas').textContent = totalPaginas;

  if(libros.length === 0){
    cont.innerHTML = '<p class="empty">Aún no has añadido ningún libro. Empieza tu ficha arriba.</p>';
    return;
  }

  libros.forEach(libro => {
    const div = document.createElement('div');
    div.className = 'book';
    div.innerHTML = `
      <div class="book-info">
        <b>${escapeHtml(libro.titulo)}</b>
        <div class="meta">${escapeHtml(libro.autor || 'Autor desconocido')} · ${libro.paginas || 0} pág.</div>
      </div>
      <div class="book-actions">
        <span class="tag ${libro.estado}" data-id="${libro.id}" data-estado="${libro.estado}">${libro.estado === 'leido' ? 'Leído' : 'Pendiente'}</span>
        <button class="del" data-id="${libro.id}">✕</button>
      </div>
    `;
    cont.appendChild(div);
  });

  cont.querySelectorAll('.tag').forEach(tag => {
    tag.addEventListener('click', async () => {
      const user = auth.currentUser;
      const nuevoEstado = tag.dataset.estado === 'leido' ? 'pendiente' : 'leido';
      await db.collection('users').doc(user.uid).collection('books').doc(tag.dataset.id).update({ estado: nuevoEstado });
    });
  });

  cont.querySelectorAll('.del').forEach(btn => {
    btn.addEventListener('click', async () => {
      const user = auth.currentUser;
      await db.collection('users').doc(user.uid).collection('books').doc(btn.dataset.id).delete();
    });
  });
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
</script>
</body>
</html>
