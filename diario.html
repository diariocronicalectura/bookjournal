<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Journal Digital</title>

    <!-- Google Fonts & Iconos -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0" />

    <!-- Estilos CSS -->
    <link rel="stylesheet" href="styles.css">
    <style>
        #logoutBtn{
            position: fixed; top: 14px; right: 14px; z-index: 50;
            background: rgba(255,255,255,0.85); border: 1px solid var(--border-color, #ebd0d6);
            color: var(--dark-rose, #6d3543); font-family: 'Montserrat', sans-serif; font-size: 12px;
            padding: 7px 14px; border-radius: 20px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        #logoutBtn:hover{ background:#fff; }
    </style>
</head>
<body>

    <button id="logoutBtn"><i class="fas fa-sign-out-alt"></i></button>

    <!-- PÁGINA 1: PORTADA -->
    <!-- <div class="journal-page cover-page">
        <img class="cover-img" src="portada.jpeg" alt="Book Journal Portada">
    </div>-->

    <!-- PÁGINA 2: LECTURAS DEL AÑO -->
    <div class="journal-page">
        <div class="page-header">
            <h1 class="page-title">Lecturas del Año</h1>
            <p class="page-subtitle">Mi Resumen Mensual</p>
            <div class="header-divider">
                <div class="line"></div>
                <i class="fa-solid fa-seedling flower"></i>
                <div class="line"></div>
            </div>
        </div>

        <!-- Grid de Meses (se genera dinámicamente) -->
        <div class="months-grid" id="monthsGrid"></div>

        <div class="year-summary-box">
            <div class="summary-item">
                <div class="label">Total Libros</div>
                <input type="number" id="total_libros" class="save-field" placeholder="0">
            </div>
            <div style="width: 1px; height: 16px; background: var(--accent-pink);"></div>
            <div class="summary-item">
                <div class="label">Total Páginas</div>
                <input type="number" id="total_paginas" class="save-field" placeholder="0">
            </div>
        </div>
    </div>

    <!-- PÁGINA 3: MI LISTA DE LIBROS -->
    <div class="journal-page">
        <div class="page-header">
            <h1 class="page-title">Mi Lista de Libros</h1>
            <p class="page-subtitle">Pendientes & Leídos</p>
            <div class="header-divider">
                <div class="line"></div>
                <i class="fa-solid fa-book-bookmark flower"></i>
                <div class="line"></div>
            </div>
        </div>

        <div class="book-list-container" id="bookListContainer">
            <div class="book-list-header">
                <span></span>
                <span>Título del Libro</span>
                <span>Autor</span>
                <span></span>
            </div>
            <!-- Filas dinámicas -->
        </div>

        <div class="add-row-control">
            <button class="btn-add-inline" onclick="addNewBookRow()">
                <i class="fa-solid fa-plus"></i> Añadir más libros
            </button>
        </div>
    </div>

    <!-- CONTENEDOR DE FICHAS DE LECTURA (DINÁMICAS) -->
    <div id="fichasContainer" style="display: flex; flex-direction: column; gap: 30px; width: 100%; align-items: center;"></div>

    <!-- Firebase (debe cargar ANTES de script.js para que pueda usar `db`/`auth`) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-auth-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-firestore-compat.min.js"></script>
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyBiM3YiN1kObjDMQszhmgrWkqlvwFgreCY",
          authDomain: "bookjournal-a201e.firebaseapp.com",
          projectId: "bookjournal-a201e",
          storageBucket: "bookjournal-a201e.firebasestorage.app",
          messagingSenderId: "336171207420",
          appId: "1:336171207420:web:59a58a5fe19eda09bb6579"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        window.currentUser = null;
    </script>

    <!-- Script JS (usa `db` y `auth` definidos arriba) -->
    <script src="script.js"></script>

    <!-- Guardián de sesión: si no hay usuario, vuelve al login -->
    <script>
        auth.onAuthStateChanged(async user => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            const doc = await db.collection('users').doc(user.uid).get();
            if (!doc.exists || doc.data().aprobado !== true) {
                await auth.signOut();
                window.location.href = 'index.html';
                return;
            }
            window.currentUser = user;
            cargarDatos(user.uid);
        });
        document.getElementById('logoutBtn').addEventListener('click', () => auth.signOut());
    </script>
</body>
</html>
